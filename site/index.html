<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citation Engine</title>
<style>
  * { box-sizing: border-box; }
  body { font:16px/1.4 system-ui,sans-serif; margin:0; background:#f5f6f8; color:#1a1a1a; overflow-x:hidden; }
  header { background:#1b1f24; color:#fff; padding:12px 14px; }
  header h1 { margin:0; font-size:1.3rem; }
  header .sub { font-size:.85rem; color:#c9d1db; } header a { color:#fff; }
  main { max-width:720px; margin:0 auto; padding:12px; }
  h2 { font-size:1.15rem; margin:.2em 0 .4em; }
  .card { display:block; background:#fff; border-radius:10px; padding:14px; margin:12px 0; text-decoration:none; color:inherit; box-shadow:0 1px 3px #0002; }
  .row { background:#fff; border-radius:8px; padding:10px; margin:8px 0; box-shadow:0 1px 2px #0002; overflow-wrap:anywhere; }
  .row h3 { margin:0 0 6px; font-size:1rem; }
  .chip { display:inline-block; padding:2px 10px; border-radius:12px; font-size:.78rem; font-weight:600; color:#fff; vertical-align:middle; }
  .found { background:#1e8e3e; } .not_found { background:#b06000; } .couldnt_check { background:#6b6b6b; } .unsearchable { background:#4a4a8a; }
  .ok { color:#1e8e3e; font-weight:600; } .no { color:#c5221f; font-weight:700; }
  .meta, .note, .nap { font-size:.85rem; color:#555; margin-top:6px; overflow-wrap:anywhere; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:6px; }
  .stat { background:#f5f6f8; border-radius:8px; padding:8px 6px; text-align:center; } .stat b { display:block; font-size:1.5rem; line-height:1.1; } .stat span { display:block; font-size:.75rem; color:#555; margin-top:2px; }
  .stat span.ok, .stat span.no { font-weight:600; }
  .errrow { border-top:1px solid #e3e5e8; padding:6px 0 2px; margin-top:6px; } .errrow .fh { margin-bottom:4px; } .found-card.has-errors { border-left:4px solid #c5221f; } .found-card.is-correct { border-left:4px solid #1e8e3e; }
  a { color:#0b57d0; word-break:break-all; } .back { display:inline-block; padding:6px 0; }
  input { width:100%; font:inherit; padding:10px; border:1px solid #bbb; border-radius:8px; }
  .btn { background:#0b57d0; color:#fff; border:0; border-radius:8px; padding:10px 14px; font-size:15px; cursor:pointer; }
  .chip.lbl { background:#6b6b6b; } .chip.stale { background:#c5221f; } .sec { margin:18px 0 6px; } .sec .n { font-size:.85rem; color:#555; font-weight:400; }
  .kv { display:flex; gap:8px; font-size:.9rem; margin:2px 0; } .kv span { min-width:76px; color:#555; } summary { cursor:pointer; padding:10px 0; color:#0b57d0; }
  .err { color:#c5221f; font-size:.85rem; min-height:18px; margin-top:6px; }
  .tabs { display:flex; gap:6px; margin:0 0 10px; overflow-x:auto; } .tab { flex:1 0 auto; text-align:center; padding:10px 12px; border-radius:8px; background:#e3e5e8; color:#1a1a1a; text-decoration:none; font-size:.9rem; font-weight:600; word-break:normal; min-height:44px; } .tab.on { background:#1b1f24; color:#fff; }
  .filters { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0; } .filters input[type=search] { grid-column:1 / -1; } .fl span { display:block; font-size:.75rem; color:#555; } .fl select { width:100%; font:inherit; padding:9px 6px; border:1px solid #bbb; border-radius:8px; background:#fff; }
  .dir { padding:0; } .dirhead { display:block; width:100%; text-align:left; background:none; border:0; font:inherit; padding:10px; cursor:pointer; color:inherit; min-height:44px; } .dn { font-weight:700; display:block; } .dd { font-size:.8rem; color:#555; display:block; margin-bottom:4px; }
  .chips .chip { margin:0 4px 4px 0; } .rt { background:#0b57d0; } .cs { background:#6b6b6b; } .wk { background:#4a4a8a; } .ac-ok { background:#1e8e3e; } .ac-blocked { background:#c5221f; } .ac-unknown { background:#6b6b6b; }
  .q-queued { background:#6b6b6b; } .q-submitted, .q-pending-verify { background:#b06000; } .q-needs-human { background:#c5221f; } .q-live { background:#1e8e3e; } .q-rejected { background:#8a1c1c; }
  .bzs { display:flex; gap:12px; flex-wrap:wrap; font-size:.85rem; } .muted { color:#777; }
  .detail { border-top:1px solid #e3e5e8; padding:8px 10px 10px; } .detail .kv { flex-wrap:wrap; } .detail .kv span { min-width:110px; } .detail .kv b { font-weight:500; overflow-wrap:anywhere; min-width:0; flex:1 1 160px; } .detail code { font-size:.78rem; word-break:break-all; }
  .bizstat { background:#f5f6f8; border-radius:8px; padding:8px; margin-top:8px; } .bizstat h4 { margin:0 0 4px; font-size:.95rem; }
  .stat { overflow-wrap:normal; word-break:normal; hyphens:none; min-width:0; } .stat span { overflow-wrap:normal; word-break:normal; hyphens:none; }
  a.biz { word-break:normal; overflow-wrap:break-word; } .biz .stat { word-break:normal; overflow-wrap:normal; } .stat small { display:block; font-size:.7rem; color:#555; margin-top:2px; }
  .biz .stats { grid-template-columns:repeat(3,minmax(0,1fr)); } .bhead { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#555; margin:12px 0 0; }
  a.stat { display:block; color:inherit; text-decoration:none; } a.bizlink { color:inherit; text-decoration:none; } .grp { font-size:1.05rem; } .row.hl { outline:2px solid #0b57d0; } .chip.act { background:#0b57d0; } .q-proof { background:#b06000; } a.seescc { margin-right:10px; } .flight .bhead { margin:6px 0 0; }
  @media (max-width:420px) { .stat small { font-size:.62rem; white-space:nowrap; } .biz .stat span { font-size:.68rem; } .biz .stat { padding:8px 3px; } }
</style>
</head>
<body>
<header><h1>Citation Engine</h1><div class="sub" id="me"></div></header>
<main id="app"></main>
<script src="vendor/supabase-2.117.3.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>

name: test-and-deploy
# Every push runs every test. The site deploys only if all of them pass.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check (.mjs copies)
        run: for f in site/*.js; do cp "$f" /tmp/chk.mjs && node --check /tmp/chk.mjs || exit 1; done
      - name: Page rules (couldn't check is never absent)
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile job
        run: python -m py_compile job/*.py job/playbooks/*.py
      - name: Golden tests 1-4 on scrubbed fixtures
        run: python tests/golden.py
      - name: Portal writer (SCC + NM allow-list, counts, failure handling)
        run: python tests/portal_test.py
      - name: Queue tests (approval gate, fail-closed login)
        run: python tests/queue_test.py
      - name: Citation state transitions (matrix, approval survives, Activities default-on, verification queue)
        run: python tests/transitions_test.py
      - name: Create-queue discovery (absent only with a positive control)
        run: python tests/create_test.py
      - name: Listing URLs, NAP errors, honest states
        run: python tests/listing_test.py
      - name: Claim status (positive marker only, missing marker is unknown)
        run: python tests/claim_test.py
      - name: Weekly claim permalink reads and hand-note preservation
        run: python tests/weekly_claim_test.py
      - name: Directory database (seed 86, upserts, create-row fix, migration shape)
        run: python tests/directories_test.py
      - name: Catalog helpers (paid-row cost + period, dead flag) and migration 004
        run: python tests/catalog_test.py
      - name: Hotfrog playbook (network, browser and mailbox mocked)
        run: python tests/hotfrog_test.py
      - name: Weekly Proof writer (match goes live and counts, mismatch waits, couldn't check writes nothing)
        run: python tests/proof_test.py
      - name: Weekly self-update (fast-forward, fails closed, never destructive)
        run: python tests/update_test.py
      - name: Permalink gate (found rows store a listing URL, never search or category)
        run: python tests/permalink_test.py
      - name: Resolver (Edith's playbooks on saved fixtures, no network)
        run: python tests/resolver_test.py
      - name: Tests never touch the real runs folder (CE_RUNS set before import run)
        run: python tests/runs_dir_check.py
      - name: Build rows (one per Directory, idempotent, no clobber, blanket approval stamp)
        run: python tests/buildrows_test.py
      - name: Build Chrome (persistent profile, fixed port, proof classifier, no form code)
        run: python tests/build_chrome_test.py
      - name: Signup URLs (only two fields, backup first, no clobber)
        run: python tests/signup_urls_test.py
      - name: Snapshot overlay keeps every row; same-state notes
        run: python tests/snapshot_test.py
      - name: Recheck job (match goes live, mismatch is a note, no permalink is nothing)
        run: python tests/recheck_test.py
      - name: Bizapedia playbook and the https:// website value (network, browser and mailbox mocked)
        run: python tests/bizapedia_test.py
      - name: Fill signup and claim URLs (only two fields, https only, backup first)
        run: python tests/fill_signup_urls_test.py
      - name: Leak check with planted control
        run: python tests/leak_check.py

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
